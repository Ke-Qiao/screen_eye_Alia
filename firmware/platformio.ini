[platformio]
default_envs = esp32dev
core_dir = ../.platformio

; Classic ESP32 + two ST7789S 240x320 on VSPI/HSPI; not ESP32-S3/C3.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.embed_files = data/eye.rgb565

; Diagnostic build: wireless control and software rendering, TFT GPIO disabled.
[env:esp32dev-wireless]
extends = env:esp32dev
build_flags = -D EYE_DISPLAY_ENABLED=0

; Diagnostic build: USB control with Wi-Fi never initialized; NVS is untouched.
[env:esp32dev-usb-only]
extends = env:esp32dev
build_flags = -D EYE_WIFI_ENABLED=0

; Diagnostic comparison: same USB-only build, weak drive on TFT signal pins only.
[env:esp32dev-usb-softdrive]
extends = env:esp32dev-usb-only
build_flags = ${env:esp32dev-usb-only.build_flags} -D EYE_SPI_DRIVE_CAP=0

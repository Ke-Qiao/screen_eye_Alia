[platformio]
default_envs = esp32dev
core_dir = ../.platformio

; Confirmed ESP32 + ST7789S 240x320, no reset pin, active-high BL on GPIO25.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps = bodmer/TFT_eSPI@2.5.43
board_build.embed_files = data/eye.rgb565
build_flags =
    -D USER_SETUP_LOADED=1
    -include include/display_setup.h

; Diagnostic build: wireless control and software rendering, TFT GPIO disabled.
[env:esp32dev-wireless]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D EYE_DISPLAY_ENABLED=0
